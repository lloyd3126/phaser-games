<!doctype html>
<html lang="zh-Hant" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="直接在瀏覽器遊玩的 Phaser 遊戲收藏。">
    <title>Phaser Games</title>
    <link rel="stylesheet" href="assets/site.css">
  </head>
  <body class="bg-body-tertiary vh-100 d-flex flex-column overflow-hidden">
    <nav class="navbar bg-body border-bottom flex-shrink-0">
      <div class="container">
        <a class="navbar-brand" href="./">Phaser Games</a>
      </div>
    </nav>

    <div class="flex-grow-1 overflow-auto page-scroll">
      <main class="container py-5">
        <section aria-labelledby="games-heading">
          <div class="d-flex align-items-center justify-content-between mb-3">
            <h2 class="h4 mb-0" id="games-heading">遊戲列表</h2>
            <span class="badge text-bg-secondary" data-game-count>{{GAME_COUNT}} 款</span>
          </div>
          <form class="mb-4" role="search" data-game-search-form>
            <input class="form-control" id="game-search" type="search" placeholder="輸入遊戲名稱、摘要或標籤" autocomplete="off" data-game-search-input aria-label="搜尋遊戲">
          </form>
          <p class="text-body-secondary d-none" data-game-search-empty>找不到符合搜尋條件的遊戲。</p>
          <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            {{GAME_CARDS}}
          </div>
        </section>
      </main>

      <footer class="border-top py-4">
        <div class="container text-body-secondary small">Built with Phaser and Bootstrap.</div>
      </footer>
    </div>

    {{GAME_MODALS}}

    <script src="assets/site.js"></script>
  </body>
</html>
