<!doctype html>
<html lang="zh-Hant" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="直接在瀏覽器遊玩的 Phaser 遊戲收藏。">
    <title>Phaser Games</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-F3w7mX95PdgyTmZZMECAngseQB83DfGTowi0iMjiWaeVhAn4FJkqJByhZMI3AhiU" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  </head>
  <body class="bg-body-tertiary min-vh-100 d-flex flex-column">
    <nav class="navbar bg-body border-bottom">
      <div class="container">
        <a class="navbar-brand" href="./"><i class="bi bi-controller me-2" aria-hidden="true"></i>Phaser Games</a>
      </div>
    </nav>

    <main class="container py-5 flex-grow-1">
      <section aria-labelledby="games-heading">
        <div class="d-flex align-items-center justify-content-between mb-3">
          <h2 class="h4 mb-0" id="games-heading">遊戲列表</h2>
          <span class="badge text-bg-secondary">{{GAME_COUNT}} 款</span>
        </div>
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
          {{GAME_CARDS}}
        </div>
      </section>
    </main>

    {{GAME_MODALS}}

    <footer class="border-top py-4">
      <div class="container text-body-secondary small">Built with Phaser and Bootstrap.</div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-/bQdsTh/da6pkI1MST/rWKFNjaCP5gBSY4sEBT38Q/9RBh9AH40zEOg7Hlq2THRZ" crossorigin="anonymous"></script>
  </body>
</html>
