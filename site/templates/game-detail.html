<!doctype html>
<html lang="zh-Hant" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{META_DESCRIPTION}}">
    <title>{{TITLE}} · Phaser Games</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body class="bg-body-tertiary min-vh-100 d-flex flex-column">
    <nav class="navbar bg-body border-bottom">
      <div class="container">
        <a class="navbar-brand" href="../../">Phaser Games</a>
      </div>
    </nav>

    <main class="container py-4 py-lg-5 flex-grow-1">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="../../">所有遊戲</a></li>
          <li class="breadcrumb-item active" aria-current="page">{{TITLE}}</li>
        </ol>
      </nav>

      <section class="row g-4 align-items-center mb-5">
        <div class="col-lg-7">
          <div class="ratio ratio-16x9 rounded overflow-hidden bg-dark">
            <img src="{{COVER_PATH}}" class="img-fluid object-fit-cover" alt="{{TITLE}} 遊戲封面">
          </div>
        </div>
        <div class="col-lg-5">
          <div class="d-flex flex-wrap gap-2 mb-3">{{TAGS}}</div>
          <h1 class="display-5 mb-3">{{TITLE}}</h1>
          <p class="lead">{{SUMMARY}}</p>
          <div class="text-body-secondary mb-4">{{DESCRIPTION}}</div>
          <div class="d-grid d-sm-block">
            <a class="btn btn-primary btn-lg" href="play/">開始遊戲</a>
          </div>
        </div>
      </section>

      <section class="row g-4 mb-5">
        <div class="col-lg-5">
          <h2 class="h4 mb-3">操作方式</h2>
          <div class="card">
            <ul class="list-group list-group-flush">
              {{CONTROLS}}
            </ul>
          </div>
        </div>
        <div class="col-lg-7">
          <h2 class="h4 mb-3">遊戲規則</h2>
          <div class="accordion" id="rules-accordion">
            {{RULES}}
          </div>
        </div>
      </section>

      {{SCREENSHOTS_SECTION}}

      <div class="d-flex flex-column flex-sm-row gap-3 border-top pt-4">
        <a class="btn btn-primary" href="play/">開始遊戲</a>
        <a class="btn btn-outline-secondary" href="../../">返回所有遊戲</a>
      </div>
    </main>

    <footer class="border-top py-4">
      <div class="container text-body-secondary small">{{TITLE}} · Phaser Games</div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
